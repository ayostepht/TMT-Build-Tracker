<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<!-- Colors match --paper in app.css (light and dark). -->
		<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f1220" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!-- "default" keeps the status bar legible in light and dark; black-translucent would draw white text on the light page. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="TMT Builds" />
		<!-- viewport-fit=cover: keep content out of the notch / rounded corners in landscape. The bottom tab bar and sheets handle the bottom inset themselves. -->
		<style>
			body {
				padding-left: env(safe-area-inset-left, 0px);
				padding-right: env(safe-area-inset-right, 0px);
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
