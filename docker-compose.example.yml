services:
  tmt-build-tracker:
    image: ghcr.io/ayostepht/tmt-build-tracker:latest
    container_name: tmt-build-tracker
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      # The container runs as uid 1000 (node): sudo chown 1000:1000 ./data first.
      # On Unraid use the template in unraid/ instead (user 99:100).
      - ./data:/data
    environment:
      # Optional. Public URL users reach the app at (no trailing slash). Leave unset
      # to accept whichever address the request arrives on (http://<lan-ip>:3000 or
      # an https proxy that sends X-Forwarded-Proto). Set it when serving over https.
      # PUBLIC_URL: https://tmt.example.com
      # Required (the container exits at start without a real value; obvious placeholders such as
      # changeme are refused). Generate with: openssl rand -hex 32 (changing it later signs everyone
      # out and makes saved printer access codes unreadable)
      BETTER_AUTH_SECRET: '' # required, 32+ characters: generate with  openssl rand -hex 32
      # Optional. Comma-separated emails that are site admins (template kits, 3D models)
      # in addition to the first account created on this install.
      # ADMIN_EMAILS: you@example.com
      # Optional OIDC single sign-on (all three required to enable; needs PUBLIC_URL)
      # OIDC_ISSUER: https://auth.example.com/application/o/tmt/
      # OIDC_CLIENT_ID: ""
      # OIDC_CLIENT_SECRET: ""
      # OIDC_PROVIDER_NAME: Authentik
      # TMT_MODE: selfhost        # or public (SSO-only Google/GitHub; printers only through OctoEverywhere links or not connected; needs https PUBLIC_URL, ADDRESS_HEADER, ADMIN_EMAILS)
      # SIGNUP: open              # open | invite | closed. Use invite or closed if reachable from the internet or with OIDC
      # GOOGLE_CLIENT_ID: ""      # Public mode; each provider needs both variables of its pair
      # (redirect URIs: <PUBLIC_URL>/api/auth/callback/google and /github)
      # GOOGLE_CLIENT_SECRET: ""
      # GITHUB_CLIENT_ID: ""
      # GITHUB_CLIENT_SECRET: ""
      # Only when ALL traffic comes through a reverse proxy you control that overwrites this header.
      # Also the client address for sign-in rate limits; unset = a client-sent X-Forwarded-For is ignored,
      # so behind a proxy everyone shares one sign-in limit (the log warns once). Set it, with XFF_DEPTH
      # if there is more than one proxy, only if every request comes through the proxy:
      # ADDRESS_HEADER: X-Forwarded-For
      # XFF_DEPTH: 1
      # Optional. Largest slicer 3MF in MB (default 1024, 256 in public mode); the image allows bodies up to 1100 MB (BODY_SIZE_LIMIT, keep it above MAX_3MF_MB + 1 MB). Other routes accept at most 1 MB (photos 9 MB, STEP zips 200 MB).
      # MAX_3MF_MB: 1024
      # Optional limits, QUOTA_* (whole number, or off). Read at start; see .env.example for the full list and defaults.
      # QUOTA_BUILDS_PER_WORKSPACE: 10
      # Optional. Free MB to keep on /data (uploads refused below it; 0/off = no check; default 2048 in public mode).
      # MIN_FREE_DISK_MB: 2048
      # Optional. Per-user API write rate limit (whole number per minute, or off; site admins exempt). Default 120/min with
      # burst 60 in public mode, off self-hosted. 429 with Retry-After when exceeded.
      # WRITE_RATE_PER_MIN: 120
      # WRITE_RATE_BURST: 60
      # Optional. off = no background printer status connections.
      # TMT_PRINTERS: off
