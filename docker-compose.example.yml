services:
  tmt-build-tracker:
    image: ghcr.io/ayostepht/tmt-build-tracker:latest
    container_name: tmt-build-tracker
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
    environment:
      # Optional. Public URL users reach the app at (no trailing slash). Leave unset
      # to accept whichever address the request arrives on (http://<lan-ip>:3000 or
      # an https proxy that sends X-Forwarded-Proto). Set it when serving over https.
      # PUBLIC_URL: https://tmt.example.com
      # Generate with: openssl rand -base64 32
      BETTER_AUTH_SECRET: change-me
      # Optional. Comma-separated emails that are site admins (template kits, 3D models)
      # in addition to the first account created on this install.
      # ADMIN_EMAILS: you@example.com
      # Optional OIDC single sign-on (all three required to enable)
      # OIDC_ISSUER: https://auth.example.com/application/o/tmt/
      # OIDC_CLIENT_ID: ""
      # OIDC_CLIENT_SECRET: ""
      # OIDC_PROVIDER_NAME: Authentik
