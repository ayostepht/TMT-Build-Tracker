services:
  tmt-build-tracker:
    image: ghcr.io/ayostepht/tmt-build-tracker:latest
    container_name: tmt-build-tracker
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
    environment:
      # Public URL users reach the app at (no trailing slash).
      ORIGIN: https://tmt.example.com
      BETTER_AUTH_URL: https://tmt.example.com
      # Generate with: openssl rand -base64 32
      BETTER_AUTH_SECRET: change-me
      # Optional OIDC single sign-on (all three required to enable)
      # OIDC_ISSUER: https://auth.example.com/application/o/tmt/
      # OIDC_CLIENT_ID: ""
      # OIDC_CLIENT_SECRET: ""
      # OIDC_PROVIDER_NAME: Authentik
