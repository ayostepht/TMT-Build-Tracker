name: docker

# Pull requests merge into `edge`; the maintainer reviews the `edge` image and then merges
# `edge` into `main`; releases are `v*` tags.
# Default mode (repository variable CI_FULL unset): a push to main or edge, or a pull request,
# runs only `test` (~4 min). `e2e` and `image` run on `v*` tags and on manual runs (Actions > docker >
# Run workflow). Set the repository variable CI_FULL=true (Settings > Secrets and variables >
# Actions > Variables) and e2e runs on every push and PR, image on every push to main or edge.
# Delete the variable to go back.
# Image tags: `latest`, `X.Y.Z` and `X.Y` only for a release tag `vX.Y.Z` (no `-` in it); a
# pre-release tag (`vX.Y.Z-rc.1`) publishes only its full version; `edge` is the `edge` branch
# (push to edge, or a manual run from edge); a push to main publishes `sha-<short>` only;
# `sha-<short>` on every published build.
# Pull requests never publish: the image job does not run for them.
on:
  push:
    branches: [main, edge]
    tags: ['v*']
    # Not evaluated for tag pushes, so releases always run. Docs-only pushes to main or edge skip the run.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - 'unraid/**'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the image to ghcr.io after test and e2e pass (a run from edge tags it edge and sha-<short>, from another branch sha-<short> only; latest and version tags come only from v* tags)'
        type: boolean
        default: true

# Every job is read-only by default; only the `image` job adds packages: write.
permissions:
  contents: read

# One run per ref; a newer push or PR update cancels the older one. Tag runs and manual runs
# are never cancelled (manual runs get their own group so they do not queue behind pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    env:
      KITPACK_DOWNLOAD: 'off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Source routes must not be gitignored (e.g. export.3mf, model.glb directories)
        run: |
          test -n "$(git ls-files ':(literal)src/routes/api/builds/[id]/export.3mf/+server.ts')"
          test -n "$(git ls-files ':(literal)src/routes/api/templates/[id]/model.glb/+server.ts')"
      - name: Audit production dependencies (fails on high or critical advisories)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run lint
      - run: npm test

  # Runs in parallel with `test`. `image` needs both, so a failing browser run blocks
  # publishing. Only on tags, manual runs and (CI_FULL=true) every push/PR; see the top.
  # Chromium is installed without `--with-deps`: the runner already carries the shared libraries
  # (it ships Chrome), and the apt step only adds font packages, which failed whenever the
  # Ubuntu mirrors were unreachable. The app self-hosts its web fonts and the specs have no
  # screenshot comparisons. The browser download is cached per Playwright version.
  e2e:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || vars.CI_FULL == 'true' }}
    env:
      KITPACK_DOWNLOAD: 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    # Skipped whenever e2e is skipped or fails (needs). Never on pull requests.
    needs: [test, e2e]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tmt-build-tracker" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/edge' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          # The Dockerfile uses this token only in the kit pack download step, to read the release
          # asset through the GitHub API (needed in a private fork; on the public repository the
          # plain release URL works too).
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
