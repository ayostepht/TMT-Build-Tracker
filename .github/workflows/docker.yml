name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    env:
      KITPACK_DOWNLOAD: 'off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Source routes must not be gitignored (e.g. export.3mf, model.glb directories)
        run: |
          test -n "$(git ls-files ':(literal)src/routes/api/builds/[id]/export.3mf/+server.ts')"
          test -n "$(git ls-files ':(literal)src/routes/api/templates/[id]/model.glb/+server.ts')"
      - name: Audit production dependencies (fails on high or critical advisories)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run lint
      - run: npm test

  # Runs in parallel with `test`. `image` needs both, so a failing browser run blocks
  # publishing from main and tags.
  # The job runs in the official Playwright image (browsers and system libraries are
  # preinstalled), so nothing is fetched through apt. Keep the tag in sync with the
  # @playwright/test version in package-lock.json; the "Playwright version matches" step fails
  # with a clear message when they drift (Dependabot bumps the lockfile, not this tag).
  e2e:
    env:
      KITPACK_DOWNLOAD: 'off'
      HOME: /root
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The image's bundled Node may not be 22; the project runs Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version matches the container image
        run: |
          want="1.64.0"
          have="$(node -p "require('@playwright/test/package.json').version")"
          test "$have" = "$want" || { echo "package-lock has Playwright $have, workflow image is v$want: update the e2e container tag"; exit 1; }
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    needs: [test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tmt-build-tracker" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          # The repo is private for now: the Dockerfile reads the kit pack release asset through the
          # GitHub API with this token (used by the download step only). Once public, the plain URL works.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
