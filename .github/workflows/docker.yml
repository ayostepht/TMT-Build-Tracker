name: docker

# Pull requests merge into `edge`; the maintainer reviews the `edge` image and then promotes
# `edge` to `main` with the `promote` workflow (a pull request into `main` that leaves out the
# files in .github/main-exclude.txt, which it starts this workflow on); releases are `v*` tags.
# Default mode (repository variable CI_FULL unset): a push to main or edge, or a pull request,
# runs only `test` (~4 min). `e2e` and `image` run on `v*` tags and on manual runs (Actions > docker >
# Run workflow). Set the repository variable CI_FULL=true (Settings > Secrets and variables >
# Actions > Variables) and e2e runs on every push and PR, image on every push to main or edge.
# Delete the variable to go back.
# Image tags: `latest`, `X.Y.Z` and `X.Y` only for a release tag `vX.Y.Z` (no `-` in it); a
# pre-release tag (`vX.Y.Z-rc.1`) publishes only its full version; `edge` is the `edge` branch
# (push to edge, or a manual run from edge); a push to main publishes `sha-<short>` only;
# `sha-<short>` on every published build.
# Pull requests never publish: the image job does not run for them. A pull request that changes
# something the image is built from (Dockerfile, .dockerignore, package.json, package-lock.json,
# .npmrc, kitpacks/, scripts/fetch-kitpacks*, this workflow) also runs `image-check`, which builds
# both platforms with `push: false`: no secrets, no `packages: write`, and a read-only build cache
# (cache-from only), so a pull request, forks included, cannot write to the cache that `image`
# uses. Otherwise a broken Dockerfile would first show up after the merge into `edge`.
# Docs-only pull requests: the `changes` job lists the files a pull request changes (the merge
# commit against its first parent, the base tip). If every file is in the docs set (the same list
# as the push `paths-ignore` below: keep the two in sync, YAML cannot share it), `test` only
# runs `prettier --check` on the changed files (no check, tests, audit or build) and `e2e` is
# skipped. The job names stay `test` and `e2e` and always appear (a skipped job counts as passed),
# so required status checks keep matching. Anything else, an empty list, pushes, tags and manual
# runs run everything. Detection only reads file names with git, never runs code from the pull
# request, and the workflow stays on `pull_request` (no secrets for forks) with read-only permissions.
on:
  push:
    branches: [main, edge]
    tags: ['v*']
    # Not evaluated for tag pushes, so releases always run. Docs-only pushes to main or edge skip the run.
    paths-ignore:
      - '*.md'
      - '.github/**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - 'unraid/**'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the image to ghcr.io after test and e2e pass (a run from edge tags it edge and sha-<short>, from another branch sha-<short> only; latest and version tags come only from v* tags)'
        type: boolean
        default: true

# Every job is read-only by default; only the `image` job adds packages: write.
permissions:
  contents: read

# One run per ref; a newer push or PR update cancels the older one. Tag runs and manual runs
# are never cancelled (manual runs get their own group so they do not queue behind pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Cheap (no install). docs_only is 'true' only for a pull request whose changed files are all
  # in the docs set; every other case, and any doubt, gives 'false'.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      image_inputs: ${{ steps.detect.outputs.image_inputs }}
    steps:
      # For a pull request this is the merge commit; depth 2 brings its first parent (the base tip).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "image_inputs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          image_inputs=false
          count=0
          # --no-renames lists both sides of a rename; deleted files count too.
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            # Files the image is built from: `image-check` builds the image for a pull request
            # that changes one of them.
            case "$f" in
              Dockerfile | .dockerignore | package.json | package-lock.json | .npmrc | kitpacks/* | scripts/fetch-kitpacks* | .github/workflows/docker.yml) image_inputs=true ;;
            esac
            case "$f" in
              # Keep in sync with `paths-ignore` under `on.push`. A `.md` below src/, e2e/,
              # scripts/ and so on is code (tests read some), so Markdown counts only at the
              # root, under .github/, docs/ and .claude/.
              docs/* | .claude/* | unraid/* | .github/*.md) ;;
              */*) docs_only=false ;;
              *.md | LICENSE) ;;
              *) docs_only=false ;;
            esac
          done < <(git diff --name-only --no-renames -z HEAD^1 HEAD)
          [ "$count" -gt 0 ] || docs_only=false
          echo "$count changed file(s), docs_only=$docs_only, image_inputs=$image_inputs"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "image_inputs=$image_inputs" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    # Runs even when `changes` failed (a skipped required check would read as passed); the first
    # step then fails it.
    if: ${{ !cancelled() }}
    env:
      KITPACK_DOWNLOAD: 'off'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if change detection did not succeed
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::The changes job did not succeed (${{ needs.changes.result }}), so this run cannot tell docs-only from code changes."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Docs-only: Prettier and its plugins are all that is needed, so skip install scripts
      # (native builds such as better-sqlite3).
      - name: Install (docs only)
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: npm ci --ignore-scripts
      - name: Prettier check on the changed docs (docs only)
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        # Existing changed files only; Prettier skips files it has no parser for or that
        # .prettierignore lists. Same check as `npm run lint`, limited to the pull request. The
        # root config is passed explicitly so a config file added by the pull request is ignored.
        run: git diff --name-only --no-renames --diff-filter=d -z HEAD^1 HEAD | xargs -0 -r npx prettier --config prettier.config.js --no-editorconfig --check --ignore-unknown --no-error-on-unmatched-pattern --
      - name: Install
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm ci
      - name: Source routes must not be gitignored (e.g. export.3mf, model.glb directories)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          test -n "$(git ls-files ':(literal)src/routes/api/builds/[id]/export.3mf/+server.ts')"
          test -n "$(git ls-files ':(literal)src/routes/api/templates/[id]/model.glb/+server.ts')"
      - name: Audit production dependencies (fails on high or critical advisories)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm audit --omit=dev --audit-level=high
      - if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm run check
      - if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm run lint
      - if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm test

  # Runs in parallel with `test`. `image` needs both, so a failing browser run blocks
  # publishing. Only on tags, manual runs and (CI_FULL=true) every push/PR; see the top.
  # Chromium is installed without `--with-deps`: the runner already carries the shared libraries
  # (it ships Chrome), and the apt step only adds font packages, which failed whenever the
  # Ubuntu mirrors were unreachable. The app self-hosts its web fonts and the specs have no
  # screenshot comparisons. The browser download is cached per Playwright version.
  e2e:
    needs: changes
    # A failed `changes` leaves docs_only empty, so this still runs (when the original condition
    # holds) and the first step fails it, instead of a skip that would read as passed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || vars.CI_FULL == 'true') }}
    env:
      KITPACK_DOWNLOAD: 'off'
    runs-on: ubuntu-latest
    # Suite takes ~31 min on ubuntu-latest (1 worker); one retry can add the 3-minute test timeout.
    timeout-minutes: 50
    steps:
      - name: Fail if change detection did not succeed
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::The changes job did not succeed (${{ needs.changes.result }}), so this run cannot tell docs-only from code changes."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Pull requests only, and only when the image's inputs changed (see the top). Builds both
  # platforms without pushing. Not a required check name: a skipped run counts as passed.
  image-check:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.image_inputs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # No gh_token secret: on the public repository the kit pack release URL needs no token.
      # cache-from only (no cache-to): reads what `image` cached for the base branch, writes nothing.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha

  image:
    # Skipped whenever e2e is skipped or fails (needs). Never on pull requests.
    needs: [test, e2e]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    # A normal build takes under 5 minutes. The arm64 half runs under QEMU and has hung until the
    # job was cancelled (hours); failing in 20 minutes lets "Re-run failed jobs" retry quickly.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tmt-build-tracker" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/edge' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          # The Dockerfile uses this token only in the kit pack download step, to read the release
          # asset through the GitHub API (needed in a private fork; on the public repository the
          # plain release URL works too).
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
