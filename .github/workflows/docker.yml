name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    env:
      KITPACK_DOWNLOAD: 'off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Source routes must not be gitignored (e.g. export.3mf, model.glb directories)
        run: |
          test -n "$(git ls-files ':(literal)src/routes/api/builds/[id]/export.3mf/+server.ts')"
          test -n "$(git ls-files ':(literal)src/routes/api/templates/[id]/model.glb/+server.ts')"
      - name: Audit production dependencies (fails on high or critical advisories)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run lint
      - run: npm test

  # Runs in parallel with `test`. `image` needs both, so a failing browser run blocks
  # publishing from main and tags.
  # Chromium is installed without `--with-deps`: the runner already carries the shared libraries
  # (it ships Chrome), and the apt step only adds font packages, which failed whenever the
  # Ubuntu mirrors were unreachable. The app self-hosts its web fonts and the specs have no
  # screenshot comparisons. The browser download is cached per Playwright version.
  e2e:
    env:
      KITPACK_DOWNLOAD: 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    needs: [test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tmt-build-tracker" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          # The repo is private for now: the Dockerfile reads the kit pack release asset through the
          # GitHub API with this token (used by the download step only). Once public, the plain URL works.
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
