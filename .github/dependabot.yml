version: 2
updates:
  # Version updates target `edge` like every other pull request (maintainer, 2026-11-13).
  # Security updates always target the default branch; GitHub ignores target-branch for them.
  - package-ecosystem: npm
    directory: /
    target-branch: edge
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The project runs Node 22; the types must match the runtime major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 upgrade is deferred until after 1.0 (maintainer, 2026-11-11;
      # PR #11 closed). Remove this entry when the upgrade is scheduled.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: edge
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
